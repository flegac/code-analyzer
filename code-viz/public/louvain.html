<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Spectral Hierarchical Clustering - Separated Components</title>
  <style>
    body { font-family: system-ui, Arial; padding: 16px; }
    pre { background:#f6f8fa; padding:12px; border-radius:6px; white-space: pre-wrap; }
    h1 { margin-top:0 }
  </style>
</head>
<body>
  <h1>Spectral Hierarchical Clustering</h1>
  <p>Classe séparée : Graph | SpectralAnalyzer | AgglomerativeClustering | SpectralHierarchicalClustering</p>
  <pre id="output">Prêt...</pre>

<script>
/* ---------- Graph ---------- */
class Graph {
  constructor() {
    this.edges = []; // {u,v,w}
    this._nodeSet = new Set();
  }
  addEdge(u, v, w = 1) {
    this.edges.push({u, v, w});
    this._nodeSet.add(u); this._nodeSet.add(v);
  }
  addEdges(edgesArray) {
    for (const e of edgesArray) this.addEdge(e.u, e.v, e.w ?? 1);
  }
  nodeCount() {
    if (this._nodeSet.size === 0) return 0;
    return Math.max(...Array.from(this._nodeSet)) + 1;
  }
  buildAdjacency() {
    const N = this.nodeCount();
    const A = Array.from({length: N}, () => Array(N).fill(0));
    for (const {u, v, w} of this.edges) {
      if (u < 0 || v < 0) continue;
      A[u][v] += w; A[v][u] += w;
    }
    return A;
  }
}

/* ---------- SpectralAnalyzer (pure spectral tasks) ---------- */
class SpectralAnalyzer {
  constructor(options = {}) {
    this.k = options.k || 2;                // embedding dimension
    this.powerMaxIter = options.powerMaxIter || 2000;
    this.powerTol = options.powerTol || 1e-8;
  }

  static dot(a,b){ let s=0; for(let i=0;i<a.length;i++) s+= (a[i]||0)*(b[i]||0); return s; }
  static norm(a){ return Math.sqrt(SpectralAnalyzer.dot(a,a)); }
  static randVec(n){ return Array.from({length:n}, ()=>Math.random()*2-1); }
  static matMulVec(M,v){ const n=M.length, out=Array(n); for(let i=0;i<n;i++){ let s=0; for(let j=0;j<M[i].length;j++) s += M[i][j]*(v[j]||0); out[i]=s;} return out; }

  static normalizedAdjacency(A){
    const n = A.length;
    const deg = A.map(r => r.reduce((s,v)=>s+v,0));
    const DinvSqrt = deg.map(d => d>0 ? 1/Math.sqrt(d) : 0);
    const M = Array.from({length:n}, ()=>Array(n).fill(0));
    for (let i=0;i<n;i++){
      for (let j=0;j<n;j++){
        if (A[i][j] !== 0) M[i][j] = DinvSqrt[i] * A[i][j] * DinvSqrt[j];
      }
    }
    return M;
  }

  powerIteration(M, maxIters=this.powerMaxIter, tol=this.powerTol){
    const n = M.length;
    if (n === 0) return {value:0, vector:[]};
    let b = SpectralAnalyzer.randVec(n);
    let lambda = 0;
    for (let it=0; it<maxIters; it++){
      const Mb = SpectralAnalyzer.matMulVec(M, b);
      const normMb = SpectralAnalyzer.norm(Mb) || 1;
      const bNext = Mb.map(x => x / normMb);
      const lambdaNext = SpectralAnalyzer.dot(bNext, SpectralAnalyzer.matMulVec(M, bNext));
      if (Math.abs(lambdaNext - lambda) < tol) { lambda = lambdaNext; b = bNext; break; }
      lambda = lambdaNext; b = bNext;
    }
    return { value: lambda, vector: b };
  }

  static deflate(M, vec, val){
    const n = M.length;
    for (let i=0;i<n;i++) for (let j=0;j<n;j++) M[i][j] -= val * (vec[i]||0) * (vec[j]||0);
  }

  topKEigen(Morig, k){
    const n = Morig.length;
    if (n === 0 || k <= 0) return { mat: [], vals: [] };
    const M = Morig.map(r => r.slice());
    const vals = [], vecs = [];
    for (let i=0;i<k;i++){
      const { value, vector } = this.powerIteration(M);
      vals.push(value); vecs.push(vector.slice());
      SpectralAnalyzer.deflate(M, vector, value);
    }
    // convert to rows: N x k
    const mat = Array.from({length:n}, ()=>Array(k).fill(0));
    for (let c=0;c<k;c++) for (let i=0;i<n;i++) mat[i][c] = vecs[c][i] || 0;
    return { mat, vals };
  }

  rowNormalize(X){
    return X.map(r => {
      const nrm = Math.sqrt(r.reduce((s,v)=>s+v*v,0)) || 1;
      return r.map(v => v / nrm);
    });
  }

  // public pipeline: accepts adjacency A, returns projection matrix rows (N x k) and eigenvalues
  run(A){
    const M = SpectralAnalyzer.normalizedAdjacency(A);
    const { mat, vals } = this.topKEigen(M, this.k);
    const projected = this.rowNormalize(mat);
    return { projected, eigenVals: vals };
  }
}

/* ---------- AgglomerativeClustering (average-linkage) ---------- */
class AgglomerativeClustering {
  constructor() {}

  static euclidean(a,b){
    let s=0;
    const n = Math.max(a.length, b.length);
    for (let i=0;i<n;i++){ const da = a[i]||0, db = b[i]||0; const d = da - db; s += d*d; }
    return Math.sqrt(s);
  }

  // computes merges: sequence of {leftId, rightId, distance, newId}
  // returns {merges, n} where n is initial number of leaves
  computeMerges(data){
    const n = data.length;
    if (n === 0) return { merges: [], n: 0 };
    // precompute pairwise distances
    const pDist = Array.from({length:n}, ()=>Array(n).fill(0));
    for (let i=0;i<n;i++){
      for (let j=i+1;j<n;j++){
        const d = AgglomerativeClustering.euclidean(data[i], data[j]);
        pDist[i][j] = pDist[j][i] = d;
      }
    }
    // clusters: array of {members:[], id}
    let clusters = [];
    for (let i=0;i<n;i++) clusters.push({ members: [i], id: i });
    let nextId = n;
    const merges = [];
    // naive O(n^3) merging (ok for small n)
    while (clusters.length > 1){
      let best = { i:-1, j:-1, dist: Infinity };
      for (let a=0;a<clusters.length;a++){
        for (let b=a+1;b<clusters.length;b++){
          const ca = clusters[a], cb = clusters[b];
          let s = 0, cnt = 0;
          for (const ia of ca.members) for (const ib of cb.members){ s += pDist[ia][ib]; cnt++; }
          const d = cnt > 0 ? s / cnt : Infinity;
          if (d < best.dist){ best = { i:a, j:b, dist: d }; }
        }
      }
      const A = clusters[best.i], B = clusters[best.j];
      const merged = { members: A.members.concat(B.members), id: nextId++ };
      merges.push({ leftId: A.id, rightId: B.id, distance: best.dist, newId: merged.id });
      clusters.splice(best.j, 1); clusters.splice(best.i, 1, merged);
    }
    return { merges, n };
  }

  // cut merges to K clusters -> labels array of length n
  static cutMergesToLabels(merges, n, K){
    if (n === 0) return [];
    if (!merges || merges.length === 0){
      // trivial: either one cluster or all separate
      if (K <= 1) return Array(n).fill(0);
      return Array.from({length:n}, (_,i)=>i);
    }
    let clusters = new Map();
    for (let i=0;i<n;i++) clusters.set(i, [i]);
    for (const m of merges){
      const left = clusters.get(m.leftId) || [m.leftId];
      const right = clusters.get(m.rightId) || [m.rightId];
      const merged = left.concat(right);
      clusters.delete(m.leftId); clusters.delete(m.rightId);
      clusters.set(m.newId, merged);
      if (clusters.size <= K) break;
    }
    const labels = Array(n).fill(-1);
    let cid = 0;
    for (const members of clusters.values()){
      for (const v of members) labels[v] = cid;
      cid++;
    }
    return labels;
  }
}

/* ---------- SpectralHierarchicalClustering orchestrator ---------- */
class SpectralHierarchicalClustering {
  constructor(options = {}) {
    this.kEmbed = options.kEmbed || 2;
    this.cutK = options.cutK || 2;
    // spectral params
    this.powerMaxIter = options.powerMaxIter || 2000;
    this.powerTol = options.powerTol || 1e-8;
  }

  runFromGraph(graph){
    const A = graph.buildAdjacency();
    return this.runFromAdjacency(A);
  }

  runFromAdjacency(A){
    if (!Array.isArray(A) || A.length === 0) {
      return { projected: [], eigenVals: [], merges: [], labels: [] };
    }
    const spectral = new SpectralAnalyzer({ k: this.kEmbed, powerMaxIter: this.powerMaxIter, powerTol: this.powerTol });
    const { projected, eigenVals } = spectral.run(A);
    // hierarchical clustering on projected rows
    const ag = new AgglomerativeClustering();
    const { merges, n } = ag.computeMerges(projected);
    const labels = AgglomerativeClustering.cutMergesToLabels(merges, n, this.cutK);
    return { projected, eigenVals, merges, labels };
  }
}
/**
 * Générateur très simple : clusters + quelques ponts + bruit
 * @param {number} n - nombre de nœuds (>=2)
 * @returns {Array<{u:number,v:number,w:number}>}
 */
function tinyClusterGraph(n) {
  if (!Number.isInteger(n) || n < 2) throw new Error('n >= 2');
  const edges = [];
  const push = (u,v,w) => {
    if (u === v) return;
    if (u > v) [u,v] = [v,u];
    edges.push({ u, v, w: Number(w.toFixed(3)) });
  };

  // partition simple en communautés consécutives (~sqrt(n) communautés)
  const nComm = Math.max(1, Math.round(Math.sqrt(n)));
  const base = Math.floor(n / nComm);
  let idx = 0;
  const comms = [];
  for (let c = 0; c < nComm; c++) {
    const size = (c === nComm - 1) ? (n - idx) : base;
    const members = [];
    for (let i = 0; i < size; i++) members.push(idx++);
    comms.push(members);
  }

  // intra-communautés : connexion dense, poids relativement élevé
  for (const members of comms) {
    for (let i = 0; i < members.length; i++) {
      for (let j = i + 1; j < members.length; j++) {
        if (Math.random() < 0.8) push(members[i], members[j], 2 + Math.random() * 3); // 2..5
      }
    }
  }

  // quelques ponts faibles entre communautés voisines
  for (let c = 0; c < comms.length - 1; c++) {
    const a = comms[c], b = comms[c + 1];
    push(a[Math.floor(Math.random()*a.length)], b[Math.floor(Math.random()*b.length)], 0.4 + Math.random()*0.8); // 0.4..1.2
    if (Math.random() < 0.3) push(a[Math.floor(Math.random()*a.length)], b[Math.floor(Math.random()*b.length)], 0.2 + Math.random()*0.6);
  }

  // un petit nombre de ponts aléatoires entre communautés non voisines
  for (let t = 0; t < Math.max(1, Math.floor(n / 10)); t++) {
    const ca = comms[Math.floor(Math.random()*comms.length)];
    const cb = comms[Math.floor(Math.random()*comms.length)];
    if (ca === cb) continue;
    push(ca[Math.floor(Math.random()*ca.length)], cb[Math.floor(Math.random()*cb.length)], 0.2 + Math.random()*1.0);
  }

  // bruit : quelques arêtes aléatoires faibles
  for (let t = 0; t < Math.max(1, Math.floor(n / 6)); t++) {
    const u = Math.floor(Math.random() * n);
    let v = Math.floor(Math.random() * n);
    if (u === v) continue;
    push(u, v, 0.1 + Math.random() * 0.9); // 0.1..1.0
  }

  // fusionner doublons en sommant les poids (simple)
  const map = new Map();
  for (const e of edges) {
    const k = `${e.u}|${e.v}`;
    map.set(k, (map.get(k) || 0) + e.w);
  }
  return Array.from(map.entries()).map(([k,w]) => {
    const [u,v] = k.split('|').map(Number);
    return { u, v, w: Number(w.toFixed(3)) };
  });
}


/* ---------- Exemple d'utilisation et affichage de la hiérarchie ---------- */
(function example(){
  const out = document.getElementById('output');
  const g = new Graph();
const edges = tinyClusterGraph(30);
  g.addEdges(edges);

  const shc = new SpectralHierarchicalClustering({ kEmbed: 3, cutK: 3 });
  const res = shc.runFromGraph(g);

  // afficher projection, eigenvals, merges et labels
  let text = 'Projection (rows = nodes, cols = k):\n' + JSON.stringify(res.projected, null, 2) + '\n\n';
  text += 'Eigen values (approx):\n' + JSON.stringify(res.eigenVals, null, 2) + '\n\n';
  text += 'Merges (hierarchy sequence):\n' + JSON.stringify(res.merges, null, 2) + '\n\n';
  text += 'Labels after cut (k=' + shc.cutK + '):\n' + JSON.stringify(res.labels, null, 2) + '\n';
  out.textContent = text;
})();
</script>
</body>
</html>
